<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ระบบจองคิวรถบรรทุก</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #3b82f6;
    --primary-hover: #2563eb;
    --bg: #f3f4f6;
    --card: #ffffff;
    --text: #1f2937;
    --muted: #6b7280;
    --border: #d1d5db;
  }
  * { box-sizing: border-box; font-family: 'Noto Sans Thai', sans-serif; }
  body { margin: 0; padding: 20px; background-color: #e5e7eb; color: var(--text); }
  .container { max-width: 900px; margin: 0 auto; background: var(--card); border-radius: 16px; padding: 24px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
  
  .header-tabs { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; border-bottom: 1px solid #e5e7eb; padding-bottom: 12px; }
  .tab-btn { background: #4f46e5; color: white; border: none; padding: 8px 18px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 0.9rem; }
  .tab-link { color: var(--muted); text-decoration: none; font-size: 0.85rem; font-weight: 500; }
  
  .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 16px; }
  @media (max-width: 768px) { .grid-3 { grid-template-columns: 1fr; } }
  
  .field { display: flex; flex-direction: column; }
  label { font-size: 0.85rem; color: var(--muted); margin-bottom: 6px; font-weight: 500; }
  input, select, textarea {
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 0.95rem;
    background: #f9fafb;
    outline: none;
    transition: 0.2s;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--primary); background: #fff; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15); }
  textarea { resize: vertical; min-height: 70px; }
  
  .btn-submit {
    width: 100%;
    background: var(--primary);
    color: white;
    border: none;
    padding: 14px;
    border-radius: 10px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    margin-top: 10px;
    transition: 0.2s;
  }
  .btn-submit:hover { background: var(--primary-hover); }
  
  .status-msg { text-align: center; margin-top: 14px; font-weight: 600; font-size: 0.9rem; }
  .status-msg.error { color: #ef4444; }
  .status-msg.success { color: #10b981; }
  
  .map-card { margin-top: 32px; padding-top: 24px; border-top: 1px solid #e5e7eb; }
  .map-header { font-weight: 700; font-size: 1.05rem; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
  .map-location { font-size: 0.9rem; color: var(--muted); margin-bottom: 16px; }
  
  .coords-row { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
  .coord-box { background: #f3f4f6; padding: 10px 16px; border-radius: 8px; font-size: 0.9rem; flex: 1; min-width: 150px; }
  .coord-box span { display: block; font-size: 0.75rem; color: var(--muted); }
  
  .btn-maps {
    background: #2563eb;
    color: white;
    text-decoration: none;
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 0.9rem;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    white-space: nowrap;
  }
  .map-note { font-size: 0.82rem; color: var(--muted); margin-top: 12px; }
</style>
</head>
<body>

<div class="container">
  <div class="header-tabs">
    <button class="tab-btn">🚚 คนขับ / บริษัทขนส่ง</button>
    <span class="tab-link">👤 เจ้าหน้าที่คลังสินค้า</span>
  </div>

  <form id="bookingForm" onsubmit="event.preventDefault(); submitBooking();">
    <div class="grid-3">
      <div class="field">
        <label>ทะเบียนรถ *</label>
        <input type="text" id="f_plate" placeholder="เช่น 34-7543" required>
      </div>
      <div class="field">
        <label>ประเภทรถ *</label>
        <select id="f_truck_type" required>
          <option value="รถกระบะ">รถกระบะ</option>
          <option value="รถบรรทุก 6 ล้อ">รถบรรทุก 6 ล้อ</option>
          <option value="รถบรรทุก 10 ล้อ">รถบรรทุก 10 ล้อ</option>
          <option value="รถเทรลเลอร์">รถเทรลเลอร์</option>
        </select>
      </div>
      <div class="field">
        <label>เจ้าหน้าที่คลังสินค้า</label>
        <input type="text" id="f_staff" placeholder="ระบุชื่อเจ้าหน้าที่">
      </div>
    </div>

    <div class="grid-3">
      <div class="field">
        <label>เบอร์โทรติดต่อ *</label>
        <input type="tel" id="f_phone" placeholder="096538732" required>
      </div>
      <div class="field">
        <label>บริษัท/หน่วยงาน</label>
        <input type="text" id="f_company" placeholder="ไม่บังคับ">
      </div>
      <div class="field">
        <label>ประเภทสินค้า *</label>
        <input type="text" id="f_product" placeholder="เช่น กระสอบทราย" required>
      </div>
    </div>

    <div class="field" style="margin-bottom: 16px;">
      <label>หมายเหตุ</label>
      <textarea id="f_remark" placeholder="ขนาดรถ, เงื่อนไขพิเศษ"></textarea>
    </div>

    <button type="submit" class="btn-submit" id="btnSubmit">ยืนยันการจอง</button>
    <div id="statusMsg" class="status-msg"></div>
  </form>

  <div class="map-card">
    <div class="map-header">📍 แผนที่ & เส้นทางไปคลังสินค้า</div>
    <div class="map-location">ที่ตั้งคลังสินค้า: มหาวิทยาลัยเทคโนโลยีพระจอมเกล้าพระนครเหนือ (มจพ.)</div>
    
    <div class="coords-row">
      <div class="coord-box">
        <span>ละติจูด</span>
        <strong>13.819137</strong>
      </div>
      <div class="coord-box">
        <span>ลองจิจูด</span>
        <strong>100.514288</strong>
      </div>
      <a href="https://www.google.com/maps?q=13.819137,100.514288" target="_blank" class="btn-maps">🗺️ เปิดเดินทางใน Google Maps</a>
    </div>

    <div class="map-note">
      * มีจุดพักรถรอคิวก่อนถึงประตูคลัง แนะนำให้แจ้ง "กำลังเดินทาง" เพื่อสะดวกในการเดินทาง
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDvVELT3wzRkozn1XnViVajQEBhwvzzXs",
    authDomain: "truck-queue-app.firebaseapp.com",
    projectId: "truck-queue-app",
    storageBucket: "truck-queue-app.appspot.com",
    messagingSenderId: "724204821916",
    appId: "1:724204821916:web:c0ed4049858427833cbc59"
  };

  let db = null;
  try {
    const app = initializeApp(firebaseConfig);
    db = getFirestore(app);
  } catch (e) {
    console.error("Firebase init failed:", e);
  }

  window.submitBooking = async function() {
    const plate = document.getElementById("f_plate").value.trim();
    const truckType = document.getElementById("f_truck_type").value;
    const staff = document.getElementById("f_staff").value.trim();
    const phone = document.getElementById("f_phone").value.trim();
    const company = document.getElementById("f_company").value.trim();
    const product = document.getElementById("f_product").value.trim();
    const remark = document.getElementById("f_remark").value.trim();
    const statusMsg = document.getElementById("statusMsg");
    const btn = document.getElementById("btnSubmit");

    if (!plate || !phone || !product) {
      statusMsg.className = "status-msg error";
      statusMsg.innerText = "กรุณากรอกข้อมูลที่จำเป็นให้ครบถ้วน";
      return;
    }

    btn.disabled = true;
    btn.innerText = "กำลังบันทึกข้อมูล...";
    statusMsg.innerText = "";

    try {
      if (db) {
        await addDoc(collection(db, "queues"), {
          plate,
          truckType,
          staff,
          phone,
          company,
          product,
          remark,
          createdAt: new Date().toISOString()
        });
      }
      statusMsg.className = "status-msg success";
      statusMsg.innerText = "✅ บันทึกข้อมูลการจองสำเร็จแล้ว!";
      document.getElementById("bookingForm").reset();
    } catch (err) {
      console.error(err);
      statusMsg.className = "status-msg error";
      statusMsg.innerText = "❌ เกิดข้อผิดพลาดในการเชื่อมต่อฐานข้อมูล: " + err.message;
    } finally {
      btn.disabled = false;
      btn.innerText = "ยืนยันการจอง";
    }
  };
</script>

</body>
</html>
